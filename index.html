<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E91E8C">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sweet Olla">
<meta name="application-name" content="Sweet Olla">
<meta name="description" content="Kasir toko Sweet Olla — penjualan, stok, kas, hutang, dan peralatan toko. Data tersimpan di perangkat ini.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; font-src 'none'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none';">
<title>Sweet Olla — Kasir</title>
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
/* Kasir Sweet Olla — tema pink elegan, kontras WCAG AA */
:root{
  --bg:#FFF0F6;
  --bg2:#FFE4F0;
  --card:#FFFFFF;
  --accent:#E91E8C;
  --accent2:#C2185B;
  --rose:#F06292;
  --rose2:#F8BBD0;
  --blush:#FCE4EC;
  --text:#3A1028;
  --muted:#5A243C;
  --line:#F3C6D8;
  --ok:#0B6A42;
  --okbg:#E5F6EE;
  --warn:#8A3D00;
  --warnbg:#FFF1DC;
  --danger:#C2185B;
  --dangbg:#FDE8F0;
  --info:#6A1B9A;
  --infobg:#F3E5F5;
  --shadow:0 10px 30px rgba(194,24,91,.10);
  --shadow-sm:0 3px 12px rgba(194,24,91,.08);
  --radius:20px;
  --radius-sm:14px;
  --side:248px;
  --top:62px;
  --bot:66px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Avenir Next","Segoe UI","Trebuchet MS","Century Gothic",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em;color:var(--text)}
p{margin:0}
a{color:var(--accent2)}
.muted{color:var(--muted)}
.small{font-size:13px}
.hide{display:none!important}

/* ===== App shell ===== */
#app{display:none;height:100%;width:100%}
#app.on{display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:auto 1fr;grid-template-areas:"side top" "side main"}
.sidebar{grid-area:side;background:linear-gradient(180deg,#fff 0%,#FFF5F9 100%);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:calc(12px + var(--safe-t)) 12px calc(12px + var(--safe-b));
  overflow:auto;z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:10px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand .logo{width:44px;height:44px;border-radius:14px;background:var(--accent);display:grid;place-items:center;box-shadow:0 6px 14px rgba(233,30,140,.28);flex-shrink:0}
.brand .logo svg{width:28px;height:28px}
.brand h1{font-family:Palatino,"Palatino Linotype",Georgia,serif;font-style:italic;font-size:20px;color:var(--accent2);line-height:1.1}
.brand small{display:block;font-family:"Avenir Next","Segoe UI",sans-serif;font-style:normal;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.nav-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 12px 2px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;border-radius:14px;color:var(--text);font-weight:600;font-size:14px;margin:1px 0;min-height:40px}
.nav-btn:hover,.nav-btn:focus-visible{background:var(--blush)}
.nav-btn.on{background:linear-gradient(90deg,#FCE4EC,#F8BBD0);color:var(--accent2);box-shadow:var(--shadow-sm)}
.nav-btn svg{width:22px;height:22px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.kasir-nav{background:var(--accent2);color:#fff;margin-top:6px;box-shadow:0 6px 16px rgba(194,24,91,.28)}
.nav-btn.kasir-nav:hover{filter:brightness(1.05)}
.nav-btn.kasir-nav.on{background:#9B1449;color:#fff}
.topbar{grid-area:top;display:flex;align-items:center;gap:10px;padding:8px 18px;padding-left:18px;min-height:var(--top);
  background:rgba(255,240,246,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
.topbar .page-title{font-size:18px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view{grid-area:main;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px 20px calc(24px + var(--safe-b));
  background:
    radial-gradient(1200px 400px at 100% -10%, rgba(240,98,146,.12), transparent 50%),
    radial-gradient(800px 300px at -10% 100%, rgba(233,30,140,.07), transparent 50%),
    var(--bg)}
.hamburger,.lock-now{display:none;width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
.lock-now{display:inline-flex}
.icon-btn{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
.icon-btn svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ===== Bottom nav (phone) ===== */
.bottom-nav{display:none;grid-area:bot;background:#fff;border-top:1px solid var(--line);padding:4px 6px calc(4px + var(--safe-b));
  z-index:6;box-shadow:0 -6px 20px rgba(194,24,91,.06)}
.bottom-nav .bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:700}
.bottom-nav .bn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bottom-nav .bn.on{color:var(--accent2)}
.bottom-nav .bn.kasir{background:var(--accent2);color:#fff;margin:-10px 6px 0;width:58px;height:58px;flex:none;border-radius:50%;box-shadow:0 8px 18px rgba(194,24,91,.35);font-size:10px}
.bottom-nav .bn.kasir svg{width:24px;height:24px}

/* ===== Cards, buttons, forms ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(243,198,216,.6);padding:16px 18px}
.card h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.kpi{padding:16px 18px;padding-right:56px;position:relative;overflow:hidden}
.kpi .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-right:36px}
.kpi .val{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.03em;white-space:nowrap}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:4px}
.kpi .ico{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:12px;background:var(--blush);display:grid;place-items:center}
.kpi .ico svg{width:20px;height:20px;stroke:var(--accent2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:14px;
  font-weight:700;background:var(--accent2);color:#fff;box-shadow:0 6px 14px rgba(194,24,91,.28);border:0;text-align:center}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:scale(.98)}
.btn.sec{background:#fff;color:var(--accent2);border:1.5px solid var(--rose2);box-shadow:var(--shadow-sm)}
.btn.ghost{background:var(--blush);color:var(--accent2);box-shadow:none}
.btn.ok{background:var(--ok);box-shadow:0 6px 14px rgba(11,106,66,.2)}
.btn.warn{background:#C05600;box-shadow:0 6px 14px rgba(192,86,0,.2)}
.btn.danger{background:var(--danger)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:12px}
.btn.lg{min-height:52px;font-size:17px;border-radius:16px;width:100%}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.5;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{
  min-height:46px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--text);outline:none;width:100%}
.field textarea{min-height:88px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(233,30,140,.15)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.search{position:relative;flex:1;min-width:160px}
.search input{width:100%;min-height:46px;padding:10px 14px 10px 42px;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:none}
.search input:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(233,30,140,.15)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8}

.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line);
  font-size:13px;font-weight:700;color:var(--muted);min-height:36px}
.chip.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;background:var(--blush);color:var(--accent2)}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.danger{background:var(--dangbg);color:var(--danger)}
.badge.info{background:var(--infobg);color:var(--info)}

.table-wrap{overflow:auto;-webkit-overflow-scrolling:touch;border-radius:14px}
table.data{width:100%;border-collapse:collapse;min-width:520px;font-size:14px}
table.data th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
table.data td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data tr:hover td{background:var(--bg)}
table.data .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.data .acts{white-space:nowrap;text-align:right}

.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty svg{width:56px;height:56px;stroke:var(--rose);fill:none;stroke-width:1.5;margin:0 auto 12px;stroke-linecap:round;stroke-linejoin:round}
.empty h3{margin-bottom:6px;color:var(--text)}

/* ===== Beranda ===== */
.hero{background:linear-gradient(135deg,#E91E8C 0%,#F06292 55%,#F48FB1 100%);color:#fff;border-radius:24px;padding:22px 24px;box-shadow:0 12px 28px rgba(233,30,140,.28);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-30px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero:after{content:"";position:absolute;right:60px;bottom:-50px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .hi{font-family:Palatino,"Palatino Linotype",Georgia,serif;font-style:italic;font-size:26px;line-height:1.25;position:relative;z-index:1}
.hero .sub{margin-top:6px;opacity:.95;font-weight:600;position:relative;z-index:1}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qbtn{background:#fff;border-radius:16px;padding:14px 10px;text-align:center;box-shadow:var(--shadow-sm);border:1px solid rgba(243,198,216,.7);min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px;color:var(--text)}
.qbtn .qi{width:40px;height:40px;border-radius:12px;background:var(--blush);display:grid;place-items:center}
.qbtn .qi svg{width:22px;height:22px;stroke:var(--accent2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ===== Kasir ===== */
.kasir-wrap{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{background:#fff;border-radius:16px;padding:12px;border:1.5px solid rgba(243,198,216,.7);box-shadow:var(--shadow-sm);text-align:left;min-height:96px;display:flex;flex-direction:column;gap:4px}
.pcard:active{transform:scale(.98)}
.pcard .pn{font-weight:800;font-size:14px;line-height:1.25}
.pcard .pp{color:var(--accent2);font-weight:800}
.pcard .ps{font-size:12px;color:var(--muted)}
.pcard.out{opacity:.5}
.cart{position:sticky;top:8px}
.cart-items{max-height:min(46vh,420px);overflow:auto}
.ci{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:10px 0;border-bottom:1px solid var(--line)}
.ci .cn{font-weight:700}
.qty{display:inline-flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.qty button{width:36px;height:36px;font-weight:800;color:var(--accent2);font-size:18px}
.qty span{min-width:28px;text-align:center;font-weight:800}

/* ===== Lists as cards (phone) ===== */
.mlist{display:none;flex-direction:column;gap:10px}
.mitem{background:#fff;border-radius:16px;padding:14px;border:1px solid rgba(243,198,216,.7);box-shadow:var(--shadow-sm)}
.mitem .t{font-weight:800}
.mitem .m{color:var(--muted);font-size:13px;margin-top:2px}

/* ===== Modal / sheet / toast / lock ===== */
#modal-bg,#sheet-bg{display:none;position:fixed;inset:0;background:rgba(58,16,40,.35);z-index:40;padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);align-items:flex-end;justify-content:center}
#modal-bg.on,#sheet-bg.on{display:flex}
#modal-bg{align-items:center}
.modal{background:#fff;border-radius:22px;padding:20px;width:min(520px,calc(100% - 24px));max-height:min(90vh,820px);overflow:auto;box-shadow:0 20px 50px rgba(58,16,40,.2)}
.modal h2{margin-bottom:12px;font-size:20px}
.sheet{background:#fff;border-radius:22px 22px 0 0;padding:12px 16px calc(16px + var(--safe-b));width:100%;max-width:640px;max-height:86vh;overflow:auto}
.sheet .handle{width:40px;height:5px;background:var(--rose2);border-radius:99px;margin:4px auto 14px}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sitem{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:16px;background:var(--bg);font-weight:700;font-size:12px;text-align:center;min-height:88px;color:var(--text)}
.sitem .qi{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.sitem .qi svg{width:22px;height:22px;stroke:var(--accent2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#toasts{position:fixed;top:calc(12px + var(--safe-t));right:12px;z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(360px,calc(100% - 24px))}
.toast{pointer-events:auto;background:#3A1028;color:#fff;padding:12px 16px;border-radius:14px;box-shadow:var(--shadow);font-weight:600;animation:pop .25s ease}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--danger)}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}

#lock,#setup{position:fixed;inset:0;z-index:50;background:
  radial-gradient(800px 400px at 50% 0%, rgba(240,98,146,.35), transparent 55%),
  var(--bg);display:none;align-items:center;justify-content:center;padding:24px;overflow:auto}
#lock.on,#setup.on{display:flex}
.lock-card{background:#fff;border-radius:28px;padding:28px 24px 24px;width:min(400px,100%);box-shadow:var(--shadow);text-align:center}
.lock-card .logo{width:72px;height:72px;border-radius:22px;background:var(--accent);display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 8px 20px rgba(233,30,140,.3)}
.lock-card .logo svg{width:44px;height:44px}
.lock-card h1{font-family:Palatino,"Palatino Linotype",Georgia,serif;font-style:italic;font-size:28px;color:var(--accent2)}
.pin-dots{display:flex;justify-content:center;gap:10px;margin:18px 0}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--rose);background:transparent}
.pin-dots i.on{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
.pad button{height:58px;border-radius:16px;background:var(--bg);font-size:22px;font-weight:800;color:var(--text)}
.pad button:active{background:var(--rose2)}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);background:#fff;border:1.5px solid var(--line);min-height:40px}
.tab.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}

.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:120px 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar-row .bar{height:12px;background:var(--blush);border-radius:99px;overflow:hidden}
.bar-row .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--rose));border-radius:99px}

.lr-box{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-weight:600}
.lr-box.total{border-bottom:0;border-top:2px solid var(--text);margin-top:8px;padding-top:12px;font-size:18px;font-weight:800}
.lr-box.plus .n{color:var(--ok)}
.lr-box.minus .n{color:var(--danger)}

/* receipt print */
#receipt{display:none}
@media print{
  body *{visibility:hidden}
  #receipt,#receipt *{visibility:visible}
  #receipt{display:block!important;position:absolute;left:0;top:0;width:280px;padding:8px;background:#fff;color:#000;font-family:"Courier New",monospace;font-size:12px}
  #app,#lock,#setup,#modal-bg,#sheet-bg,#toasts,.bottom-nav{display:none!important}
}

/* ===== Responsive ===== */
@media (max-width:1024px){
  #app.on{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"top" "main" "bot"}
  .sidebar{display:none;position:fixed;inset:0 auto 0 0;width:min(280px,86vw);z-index:30;box-shadow:var(--shadow);border-right:1px solid var(--line)}
  .sidebar.open{display:flex}
  #sb-backdrop{display:none;position:fixed;inset:0;background:rgba(58,16,40,.35);z-index:25}
  #sb-backdrop.on{display:block}
  .hamburger{display:inline-flex}
  .bottom-nav{display:flex}
  #view{padding:14px 14px calc(20px + var(--bot) + var(--safe-b))}
  .bottom-nav{position:fixed;left:0;right:0;bottom:0}
  .kasir-wrap{grid-template-columns:1fr}
  .cart{position:static}
  .kasir-bar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + var(--bot) + var(--safe-b));z-index:7;background:var(--accent);color:#fff;border-radius:16px;padding:10px 14px;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 8px 18px rgba(233,30,140,.35);font-weight:700}
  .kasir-bar .btn{background:#fff;color:var(--accent2);box-shadow:none;min-height:40px}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
  .quick{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:767px){
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  .quick{grid-template-columns:repeat(2,1fr)}
  .desk-only{display:none!important}
  .mlist{display:flex}
  .hero .hi{font-size:22px}
  .kpi .val{font-size:18px}
  table.data{font-size:13px}

  function sisaHutangNota(pb){
    const bayar=db.hutangBayar.filter(x=>x.purchaseId===pb.id).reduce((s,x)=>s+x.jumlah,0);
    const retur=db.purchaseReturns.filter(x=>x.purchaseId===pb.id && x.metode==="potong_hutang").reduce((s,x)=>s+x.total,0);

  // Recalc hutang: total - initial dibayar - later payments - retur potong
  // In seed, pb2 dibayar=200000 AND hutangBayar 200000 would double-count.
  // Fix: store dibayar as initial payment only; hutangBayar is additional. In seed I'll remove duplicate from formula by not including hutangBayar that's the DP... 
  // Cleaner: sisa = total - all payments (dibayar + hutangBayar) - retur potong. Then fix seed: pb2.dibayar=0 and only hutangBayar, OR pb2.dibayar=200000 and no hutangBayar for DP.
  // I'll use: payments = dibayar + hutangBayar.filter, and fix seed later if needed. Let me change seed mentally: remove hutangBayar dp or set dibayar 0.
  // I'll redefine:
  // Actually let me change sisa to: total - dibayar - payments - retur, and in seed set pb2.dibayar=200000 and delete the hutangBayar DP... or keep hutangBayar as the only payment ledger.
  // Best model:
  // purchase.dibayar = amount paid at purchase time
  // hutangBayar = later payments
  // sisa = total - dibayar - later payments - retur potong
  // I'll remove the seed hutangBayar DP or set catatan and still not double: I already have both. I'll fix seed in a patch: delete db.hutangBayar DP or set dibayar 0.

  function sisaHutang(pb){
    const later=db.hutangBayar.filter(x=>x.purchaseId===pb.id).reduce((s,x)=>s+Number(x.jumlah),0);
    const retur=db.purchaseReturns.filter(x=>x.purchaseId===pb.id && x.metode==="potong_hutang").reduce((s,x)=>s+Number(x.total),0);
    return Math.max(0, Math.round(pb.total - (Number(pb.dibayar)||0) - later - retur));
  }
  function sisaPiutang(sale){
    const later=db.piutangBayar.filter(x=>x.saleId===sale.id).reduce((s,x)=>s+Number(x.jumlah),0);
    const retur=db.saleReturns.filter(x=>x.saleId===sale.id && x.metode==="potong_piutang").reduce((s,x)=>s+Number(x.total),0);
    const awal = sale.metode==="kasbon" ? (Number(sale.total)||0) - (Number(sale.bayar)||0) : 0;
    // if kasbon, bayar might be 0 or partial
    if(sale.metode!=="kasbon" && sale.status==="lunas") return 0;
    return Math.max(0, Math.round((sale.metode==="kasbon"?sale.total-(sale.bayar||0): (sale.status!=="lunas"?sale.total-(sale.bayar||0):0)) - later - retur));
  }
  function totalHutang(){ return db.purchases.reduce((s,p)=>s+sisaHutang(p),0); }
  function totalPiutang(){ return db.sales.reduce((s,p)=>s+sisaPiutang(p),0); }

  function penjualanPeriod(from,to){
    let jual=0, hpp=0;
    for(const s of db.sales){
      if(!inRange(s.tanggal,from,to)) continue;
      for(const it of s.items){
        jual += it.qty*it.hargaJual - (it.disc||0);
        hpp += it.qty*(it.hargaBeli||0);
      }
      jual -= s.diskon||0;
    }
    let returJ=0, returH=0;
    for(const r of db.saleReturns){
      if(!inRange(r.tanggal,from,to)) continue;
      returJ += r.total;
      returH += (r.items||[]).reduce((s,i)=>s+i.qty*(i.hargaBeli||0),0);
    }
    const peng=db.expenses.filter(e=>inRange(e.tanggal,from,to)).reduce((s,e)=>s+e.jumlah,0);
    const bersihJual=jual-returJ;
    const bersihHpp=hpp-returH;
    const labaKotor=bersihJual-bersihHpp;
    return {jual, returJ, bersihJual, hpp:bersihHpp, labaKotor, peng, labaBersih:labaKotor-peng};
  }

  function stripFancy(s){
    return String(s||"").replace(/[🌸💕✨🎉💖🧁]/g,"*").replace(/[^\x09\x0a\x0d\x20-\x7E\u00A0-\u00FF]/g,"?");
  }
  function encAscii(s){
    const t=stripFancy(s);
    const out=new Uint8Array(t.length);
    for(let i=0;i<t.length;i++) out[i]=t.charCodeAt(i)&0xFF;
    return out;
  }
  function bytesConcat(parts){
    const n=parts.reduce((s,p)=>s+p.length,0);
    const o=new Uint8Array(n); let i=0;
    for(const p of parts){ o.set(p,i); i+=p.length; }
    return o;
  }
  const _u = (a)=> new Uint8Array(a);
  const ESC=0x1B, GS=0x1D;
  const EP = {
    init: ()=>_u([ESC,0x40]),
    align: (n)=>_u([ESC,0x61,n]), // 0 left 1 center 2 right
    bold: (on)=>_u([ESC,0x45,on?1:0]),
    size: (n)=>_u([GS,0x21,n]), // 0 normal, 0x11 double
    feed: (n)=>_u([ESC,0x64,n]),
    cut: ()=>_u([GS,0x56,0x41,0x10]), // partial cut + feed
    text: (s)=>encAscii(s),
    line: (s)=>encAscii(String(s||"")+"\n"),
    hr: (w)=>encAscii("-".repeat(w)+"\n"),
    qr: (data, size=4) => {
      const d=encAscii(String(data||""));
      const storeLen=d.length+3;
      const pL=storeLen&0xFF, pH=(storeLen>>8)&0xFF;
      return bytesConcat([
        _u([GS,0x28,0x6B,0x04,0x00,0x31,0x41,0x32,0x00]), // model 2
        _u([GS,0x28,0x6B,0x03,0x00,0x31,0x43, size]),      // module size
        _u([GS,0x28,0x6B,0x03,0x00,0x31,0x45,0x30]),       // EC level L
        _u([GS,0x28,0x6B, pL, pH, 0x31, 0x50, 0x30]), d,   // store
        _u([GS,0x28,0x6B,0x03,0x00,0x31,0x51,0x30]),       // print
      ]);
    }
  };

  function strukWidthChars(){ return db.settings.lebarStruk==="80" ? 42 : 32; }
  function padRow(left, right, w){
    left=String(left); right=String(right);
    const space=Math.max(1, w-left.length-right.length);
    return left+" ".repeat(space)+right;
  }
  function wrapLine(s, w){
    s=String(s||"").trim();
    if(!s) return [""];
    const out=[];
    const words=s.split(/\s+/);
    let cur="";
    const pushWord=(word)=>{
      if((cur?cur+" ":"")+word !== word && (cur+" "+word).trim().length<=w){ cur=(cur+" "+word).trim(); return; }
      if(cur){ out.push(cur); cur=""; }
      if(word.length<=w){ cur=word; return; }
      for(let i=0;i<word.length;i+=w) out.push(word.slice(i,i+w));
    };
    words.forEach(pushWord);
    if(cur) out.push(cur);
    return out.length?out:[""];
  }

  function buildStrukLines(sale){

    if(st.alamat) wrapLine(st.alamat,w).forEach(x=>push({t:x,a:"c"}));
    if(st.telepon) push({t:"Telp. "+st.telepon,a:"c"});
    push({hr:true});
    push({t:"No  : "+sale.no});
    push({t:"Tgl : "+fmtDate(sale.tanggal)+(sale.waktu?" "+fmtTime(sale.waktu):"")});
    const cn=sale.customerId? (cust(sale.customerId)?.nama||"-") : "Umum";
    push({t:"Plg : "+cn});
    const metodeNama={tunai:"Tunai",transfer:"Transfer",qris:"QRIS",kasbon:"Kasbon"}[sale.metode]||sale.metode;
    push({t:"Bayar: "+metodeNama});
    push({hr:true});
    for(const it of sale.items){
      wrapLine(it.nama,w).forEach(x=>push({t:x}));
      const sub=it.qty*it.hargaJual-(it.disc||0);
      push({t:padRow("  "+it.qty+" x "+rp(it.hargaJual), rp(sub), w)});
    }
    if(sale.diskon) push({t:padRow("Diskon", "-"+rp(sale.diskon), w)});
    push({hr:true});
    push({t:padRow("TOTAL", rp(sale.total), w), b:true});
    if(sale.metode==="tunai"){
      push({t:padRow("Bayar", rp(sale.bayar), w)});
      push({t:padRow("Kembali", rp(sale.kembalian), w)});
    } else if(sale.metode==="kasbon"){
      push({t:padRow("Dibayar", rp(sale.bayar||0), w)});
      push({t:padRow("Sisa kasbon", rp(sisaPiutang(sale)), w), b:true});
      if(sale.jatuhTempo) push({t:"Jatuh tempo: "+fmtDate(sale.jatuhTempo)});
    }
    push({hr:true});
    if(st.footerStruk) wrapLine(stripFancy(st.footerStruk),w).forEach(x=>push({t:x,a:"c"}));
    push({t:"",a:"c"});
    return lines;
  }

  function strukToText(sale){
    const w=strukWidthChars();
    return buildStrukLines(sale).map(l=>{
      if(l.hr) return "-".repeat(w);
      const t=l.t||"";
      if(l.a==="c"){ const p=Math.max(0, Math.floor((w-t.length)/2)); return " ".repeat(p)+t; }
      return t;
    }).join("\n");
  }

  function strukToHtml(sale){
    const w=db.settings.lebarStruk==="80"?"r80":"r58";
    const inner=buildStrukLines(sale).map(l=>{
      if(l.hr) return "<div style='border-top:1px dashed #000;margin:4px 0'></div>";
      const al=l.a==="c"?"center":"left";
      const b=l.b?"font-weight:700;":"";
      const sz=l.sz?"font-size:1.25em;":"";
      return `<div style="text-align:${al};${b}${sz}">${esc(l.t||" ")}</div>`;
    }).join("");
    return {w, html:inner};
  }

  function buildEscpos(sale, opts={}){
    const w=strukWidthChars();
    const parts=[EP.init()];
    for(const l of buildStrukLines(sale)){
      if(l.hr){ parts.push(EP.align(0), EP.bold(false), EP.size(0), EP.hr(w)); continue; }
      parts.push(EP.align(l.a==="c"?1:0), EP.bold(!!l.b), EP.size(l.sz?0x11:0), EP.line(l.t||""));
    }
    parts.push(EP.align(0), EP.bold(false), EP.size(0));
    if(opts.qr){ parts.push(EP.align(1), EP.qr(opts.qr, db.settings.lebarStruk==="80"?5:4), EP.feed(1)); }
    parts.push(EP.align(1), EP.line(" "), EP.feed(2), EP.cut());
    return bytesConcat(parts);
  }

  async function writePrinter(data){
    if(printer.kind==="serial" && printer.writer){
      await printer.writer.write(data);
      return true;
    }
    if(printer.kind==="bt" && printer.char){
      const chunk=180;
      for(let i=0;i<data.length;i+=chunk){
        const slice=data.slice(i,i+chunk);
        await printer.char.writeValueWithoutResponse?.(slice).catch(()=>printer.char.writeValue(slice));
        await new Promise(r=>setTimeout(r,20));
      }
      return true;
    }
    return false;
  }

  async function connectBluetooth(){
    const services=[
      "000018f0-0000-1000-8000-00805f9b34fb",
      "0000ff00-0000-1000-8000-00805f9b34fb",
      "0000ae30-0000-1000-8000-00805f9b34fb",
      "0000fff0-0000-1000-8000-00805f9b34fb",
      "0000ff80-0000-1000-8000-00805f9b34fb",
      "0000e110-0000-1000-8000-00805f9b34fb",
    ];
    const dev=await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:services
    });
    const server=await dev.gatt.connect();
    let char=null, used=null;
    const all=await server.getPrimaryServices();
    for(const svc of all){
      const chs=await svc.getCharacteristics();
      for(const c of chs){
        const p=c.properties;
        if(p.write||p.writeWithoutResponse){ char=c; used=svc.uuid; break; }
      }
      if(char) break;
    }
    if(!char) throw new Error("Printer ditemukan, tapi tidak bisa dikirimi data. Coba mode cetak biasa (window.print).");
    printer.kind="bt"; printer.device=dev; printer.char=char; printer.name=dev.name||"Bluetooth";
    dev.addEventListener("gattserverdisconnected", ()=>{ if(printer.device===dev){ printer.kind=null; printer.char=null; printer.device=null; printer.name=""; toast("Printer terputus","err"); if(ui.page==="pengaturan") render(); } });
    toast("Terhubung ke "+printer.name,"ok");
  }

  async function connectSerial(){
    const port=await navigator.serial.requestPort();
    const baud=Number(db.settings.baudrate)||9600;
    await port.open({ baudRate:baud });
    printer.kind="serial"; printer.port=port; printer.writer=port.writable.getWriter(); printer.name="USB / Serial";
    toast("Printer USB/Serial terhubung","ok");
  }

  async function disconnectPrinter(){
    try{ if(printer.writer){ printer.writer.releaseLock(); } }catch(e){}
    try{ if(printer.port){ await printer.port.close(); } }catch(e){}
    try{ if(printer.device?.gatt?.connected) printer.device.gatt.disconnect(); }catch(e){}
    printer.kind=null; printer.device=null; printer.char=null; printer.port=null; printer.writer=null; printer.name="";
    toast("Printer diputus");
  }

  function bindPage(){
    const q=$("#q");
    if(q){ q.addEventListener("input", e=>{ ui.q=e.target.value; /* live filter without losing focus */ const pos=q.selectionStart; render(); const n=$("#q"); if(n){ n.focus(); n.setSelectionRange(pos,pos);} }); }
    const cc=$("#cartCust"); if(cc) cc.addEventListener("change", e=> ui.cartCust=e.target.value);
    const cd=$("#cartDisc"); if(cd) cd.addEventListener("input", e=>{ ui.cartDisc=num(e.target.value); });
    const cp=$("#cartPay"); if(cp) cp.addEventListener("change", e=>{ ui.cartPay=e.target.value; render(); });
    const cb=$("#cartBayar"); if(cb) cb.addEventListener("input", e=> ui.cartBayar=e.target.value);
    const du=$("#cartDue"); if(du) du.addEventListener("change", e=> ui.cartDue=e.target.value);
    const fr=$("#from"); if(fr) fr.addEventListener("change", e=> ui.from=e.target.value);
    const to=$("#to"); if(to) to.addEventListener("change", e=> ui.to=e.target.value);
  }

  /* ===================== FORMS & ACTIONS ===================== */
  function field(id,label,type,val,opts){
    if(type==="select"){
      return `<div class="field"><label>${esc(label)}</label><select id="${id}">${opts}</select></div>`;
    }
    if(type==="textarea") return `<div class="field"><label>${esc(label)}</label><textarea id="${id}">${esc(val||"")}</textarea></div>`;
    return `<div class="field"><label>${esc(label)}</label><input id="${id}" type="${type||"text"}" value="${esc(val??"")}" ${opts||""}></div>`;
  }
  function formButtons(saveAct, saveLabel="Simpan"){

  function formBeli(){
    if(!db.suppliers.length) return toast("Tambah supplier dulu ya","err");
    const opts=db.suppliers.map(s=>`<option value="${s.id}">${esc(s.nama)}</option>`).join("");
    const prods=db.products.map(p=>`<option value="${p.id}">${esc(p.nama)}</option>`).join("");
    openModal(`<h2>Nota beli baru</h2>
      <div class="g2 grid">
        ${field("f-sup","Supplier","select","",opts)}

      <div class="g2 grid" style="margin-top:12px">
        ${field("f-met","Cara bayar","select","", `<option value="tunai">Tunai (kas keluar)</option><option value="transfer">Transfer</option><option value="hutang">Hutang / bayar nanti</option>`)}
        ${field("f-bayar","Sudah dibayar (Rp)","number",0,'min="0"')}
        ${field("f-due","Jatuh tempo (jika hutang)","date","")}
        ${field("f-catatan","Catatan","text","")}
      </div>
      <p><b>Total: <span id="beli-total">Rp0</span></b></p>
      ${formButtons("save-beli","Simpan nota beli")}`);
    const box=$("#beli-items");
    const add=()=>{
      const row=document.createElement("div");
      row.className="g3 grid beli-row"; row.style.marginBottom="8px";
      row.innerHTML=`<div class="field"><label>Barang</label><select class="bi-p">${prods}</select></div>
        <div class="field"><label>Jumlah</label><input class="bi-q" type="number" min="0.01" step="0.01" value="1"></div>
        <div class="field"><label>Harga beli</label><input class="bi-h" type="number" min="0" value=""></div>`;
      box.appendChild(row);
      const fill=()=>{ const p=prod(row.querySelector(".bi-p").value); if(p && !row.querySelector(".bi-h").value) row.querySelector(".bi-h").value=p.hargaBeli; tot(); };
      row.querySelector(".bi-p").addEventListener("change", fill);
      row.querySelector(".bi-q").addEventListener("input", tot);
      row.querySelector(".bi-h").addEventListener("input", tot);
      fill();
    };
    const tot=()=>{
      let t=0; $$(".beli-row").forEach(r=> t+=num(r.querySelector(".bi-q").value)*num(r.querySelector(".bi-h").value));
      const el=$("#beli-total"); if(el) el.textContent=rp(t);
    };
    $("#add-bi").onclick=add; add();
  }
  function saveBeli(){
    const supplierId=v("f-sup"); if(!supplierId) return toast("Pilih supplier","err");
    const items=[];
    $$(".beli-row").forEach(r=>{
      const p=prod(r.querySelector(".bi-p").value); const qty=num(r.querySelector(".bi-q").value); const hb=num(r.querySelector(".bi-h").value);
      if(p && qty>0) items.push({productId:p.id,nama:p.nama,qty,hargaBeli:hb});
    });
    if(!items.length) return toast("Isi barang yang dibeli","err");
    const total=items.reduce((s,i)=>s+i.qty*i.hargaBeli,0);
    const metode=v("f-met"); let dibayar=vn("f-bayar");
    if(metode==="tunai"||metode==="transfer") dibayar=total;
    if(dibayar>total) dibayar=total;
    const rec={id:uid("pb"),no:nextNo("PB",db.purchases),tanggal:v("f-tgl")||today(),supplierId,items,total,dibayar,metode,jatuhTempo:v("f-due"),status:dibayar>=total?"lunas":(dibayar>0?"sebagian":"belum"),catatan:v("f-catatan")};
    db.purchases.push(rec);
    for(const it of items){
      adjStock(it.productId, it.qty);
      const p=prod(it.productId); if(p && it.hargaBeli>0) p.hargaBeli=it.hargaBeli;
    }
    if(dibayar>0 && metode==="tunai") addCash("keluar", dibayar, "Beli barang", "Nota "+rec.no, rec.tanggal, rec.id);
    save(); closeModal(); toast("Nota beli disimpan. Stok bertambah.","ok"); render();
  }

  function checkout(){
    if(!ui.cart.length) return;
    const sub=ui.cart.reduce((s,i)=>s+i.qty*i.hargaJual,0);
    const disc=Number(ui.cartDisc)||0;
    const total=Math.max(0,sub-disc);
    const metode=ui.cartPay||"tunai";
    if(metode==="kasbon" && !ui.cartCust) return toast("Pilih nama pelanggan untuk kasbon","err");
    let bayar=0, kembalian=0;
    if(metode==="tunai"){
      bayar=num(ui.cartBayar);
      if(bayar<total) return toast("Uang diterima kurang dari total","err");
      kembalian=bayar-total;
    } else if(metode!=="kasbon"){ bayar=total; }
    for(const it of ui.cart){
      const p=prod(it.productId);
      if(!p || p.stok<it.qty) return toast("Stok "+it.nama+" tidak cukup","err");
    }
    const sale={
      id:uid("s"), no:nextNo("PJ",db.sales), tanggal:today(), waktu:nowIso(),
      customerId:ui.cartCust||"", items:ui.cart.map(i=>({productId:i.productId,nama:i.nama,qty:i.qty,hargaJual:i.hargaJual,hargaBeli:i.hargaBeli||0,disc:0})),
      subtotal:sub, diskon:disc, total, bayar, kembalian, metode, status:metode==="kasbon"?(bayar>=total?"lunas":"belum"):"lunas",
      jatuhTempo:metode==="kasbon"? (ui.cartDue||"") : "", catatan:""
    };
    db.sales.push(sale);
    for(const it of sale.items) adjStock(it.productId, -it.qty);
    if(metode==="tunai") addCash("masuk", total, "Penjualan", sale.no, sale.tanggal, sale.id);
    save();
    ui.cart=[]; ui.cartDisc=0; ui.cartBayar=""; ui.cartDue="";
    toast("Transaksi tersimpan","ok");
    render();
    const prev=strukToHtml(sale);
    openModal(`<h2>Transaksi berhasil 🌸</h2>
      <p>Total <b>${rp(total)}</b>${metode==="tunai"?` · Kembali <b>${rp(kembalian)}</b>`:""}</p>
      <div class="preview-struk ${prev.w}">${prev.html}</div>
      <div class="row" style="margin-top:12px">
        <button class="btn grow" data-act="cetak-struk" data-id="${sale.id}">${ico("print")} Cetak struk</button>
        <button class="btn sec grow" data-act="close-modal">Selesai</button>
      </div>`);
  }

  function doRestore(file){
    const reader=new FileReader();
    reader.onload=async ()=>{
      try{
        const j=JSON.parse(reader.result);
        const incoming=j.db||j;
        if(!incoming || typeof incoming!=="object") throw new Error("Format tidak dikenal");
        const ok=await confirmAct("Kembalikan data?","Data sekarang akan diganti dengan isi file cadangan. Tidak bisa dibatalkan. Pastikan file ini milik Sweet Olla.");
        if(!ok) return;
        const next=Object.assign(defaultDb(), incoming);
        next.settings=Object.assign(defaultDb().settings, incoming.settings||{});
        ["products","suppliers","customers","sales","purchases","saleReturns","purchaseReturns","expenses","cash","opnames","assets","hutangBayar","piutangBayar"].forEach(k=>{ if(!Array.isArray(next[k])) next[k]=[]; });
        db=next; normalize(); save();
        toast("Data berhasil dikembalikan","ok"); render();
      }catch(e){ toast("File tidak bisa dibaca. Pilih file cadangan yang benar.","err"); }
    };
    reader.readAsText(file);
  }

  function addCart(id){
    const p=prod(id); if(!p) return;
    const ex=ui.cart.find(i=>i.productId===id);
    if(ex){ if(ex.qty+1>p.stok) return toast("Stok tidak cukup","err"); ex.qty++; }
    else ui.cart.push({productId:p.id,nama:p.nama,qty:1,hargaJual:p.hargaJual,hargaBeli:p.hargaBeli||0});
    render();
  }
  function changeQty(id,d){
    const ex=ui.cart.find(i=>i.productId===id); if(!ex) return;
    const p=prod(id);
    ex.qty+=d;
    if(ex.qty<=0) ui.cart=ui.cart.filter(i=>i.productId!==id);
    else if(p && ex.qty>p.stok){ ex.qty=p.stok; toast("Stok tidak cukup","err"); }
    render();
  }

    if(!m) return;
    clearTimeout(idleTimer);
    idleTimer=setTimeout(()=>{ if(sessionStorage.getItem(SES_KEY)) lockNow(); }, m*60*1000);
  }
  function lockNow(){
    sessionStorage.removeItem(SES_KEY);
    ui.pinBuf="";
    $("#app").classList.remove("on");
    $("#setup").classList.remove("on");
    $("#lock").classList.add("on");
    renderPinDots();
  }
  function renderPinDots(){
    const dots=$("#pin-dots"); if(!dots) return;
    dots.innerHTML=[0,1,2,3,4,5,6,7].slice(0, Math.max(4, ui.pinBuf.length||4)).map((_,i)=>`<i class="${i<ui.pinBuf.length?"on":""}"></i>`).join("");
  }
  async function pinKey(k){
    if(k==="C"){ ui.pinBuf=""; renderPinDots(); return; }
    if(k==="B"){ ui.pinBuf=ui.pinBuf.slice(0,-1); renderPinDots(); return; }
    if(ui.pinBuf.length>=8) return;
    ui.pinBuf+=k; renderPinDots();
    if(ui.pinBuf.length>=4){
      if(await checkPin(ui.pinBuf)){
        sessionStorage.setItem(SES_KEY,"1");
        ui.pinBuf="";
        $("#lock").classList.remove("on");
        showApp();
      } else if(ui.pinBuf.length>=6){
        toast("PIN salah","err"); ui.pinBuf=""; renderPinDots();
      }
    }
  }
  function showApp(){
    $("#setup").classList.remove("on");
    $("#lock").classList.remove("on");
    $("#app").classList.add("on");
    bumpIdle();
    render();
  }

  function showSetup(){
    $("#lock").classList.remove("on");
    $("#app").classList.remove("on");
    $("#setup").classList.add("on");
    renderSetup();
  }
  function renderSetup(){
    const s=ui.setup;
    const step=s.step||1;
    let body="";
    if(step===1){
      body=`<div class="logo">${I.cake}</div>
        <h1>Sweet Olla</h1>
        <p class="muted" style="margin:8px 0 18px">Selamat datang di kasir toko. Kita atur dulu sebentar, mudah saja.</p>
        ${field("su-nama","Nama toko","text",s.namaToko)}
        ${field("su-pemilik","Nama panggilan (opsional)","text",s.namaPemilik,'placeholder="Supaya beranda bisa menyapa kamu"')}
        <button class="btn lg" id="su-next">Lanjut</button>`;
    } else if(step===2){
      body=`<h1>Buat PIN</h1>
        <p class="muted" style="margin:8px 0 18px">PIN 4–8 angka supaya data toko aman di perangkat ini. Tidak dikirim ke internet.</p>
        ${field("su-pin","PIN","password",s.pin,'inputmode="numeric" maxlength="8"')}
        ${field("su-pin2","Ulangi PIN","password",s.pin2,'inputmode="numeric" maxlength="8"')}
        <button class="btn lg" id="su-next">Lanjut</button>`;
    } else {
      body=`<h1>Siap mulai?</h1>
        <p class="muted" style="margin:8px 0 18px">Boleh isi data contoh (kue, pelanggan, peralatan) supaya kamu bisa coba-coba. Nanti bisa dihapus di Pengaturan.</p>
        <label class="row" style="margin-bottom:16px;justify-content:center"><input id="su-demo" type="checkbox" ${s.demo?"checked":""}> Isi data contoh dulu</label>
        <button class="btn lg" id="su-next">Masuk ke toko 🌸</button>`;
    }
    $("#setup-card").innerHTML=body;
    $("#su-next").onclick=async ()=>{
      if(step===1){ s.namaToko=v("su-nama")||"Sweet Olla"; s.namaPemilik=v("su-pemilik"); s.step=2; renderSetup(); }
      else if(step===2){
        const pin=v("su-pin"), pin2=v("su-pin2");
        if(!/^\d{4,8}$/.test(pin)) return toast("PIN harus 4–8 angka","err");
        if(pin!==pin2) return toast("Ulangan PIN tidak sama","err");
        s.pin=pin; s.step=3; renderSetup();
      } else {
        s.demo=$("#su-demo")?.checked;
        db=defaultDb();
        db.settings.namaToko=s.namaToko||"Sweet Olla";
        db.settings.namaPemilik=s.namaPemilik||"";
        if(s.demo) seedDemo();
        db.settings.namaToko=s.namaToko||"Sweet Olla";
        db.settings.namaPemilik=s.namaPemilik||"";
        await setPin(s.pin);
        sessionStorage.setItem(SES_KEY,"1");
        showApp();
      }
    };
  }

  /* ===================== INIT ===================== */
  function cakeLogo(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11c0-2 2.2-3.5 6-3.5s6 1.5 6 3.5"/><path d="M5 11h14v8a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-8z"/><path d="M12 4v3.5"/><circle cx="12" cy="3.2" r=".9" fill="#FFE27A" stroke="none"/></svg>`; }

  function boot(){
    const existed=load();
    normalize();
    // demo shortcut for preview
    const demo = location.hash==="#demo" || /(?:\?|&)demo=1(?:&|$)/.test(location.search);
    if(demo){
      if(!existed || !db.products.length){ seedDemo(); normalize(); }
      sessionStorage.setItem(SES_KEY,"1");
      showApp();
    } else if(!existed || !db.security?.hash){
      showSetup();
    } else if(sessionStorage.getItem(SES_KEY)==="1"){
      showApp();
    } else {
      lockNow();
    }
    const lockPad=$("#pad");
    if(lockPad) lockPad.innerHTML=["1","2","3","4","5","6","7","8","9","C","0","B"].map(k=>`<button data-k="${k}">${k==="B"?"⌫":k==="C"?"Hapus":k}</button>`).join("");

    document.addEventListener("click", ev=>{
      const el=ev.target.closest("[data-act]");
      if(el){ ev.preventDefault(); onAct(el.dataset.act, el, ev); }
      const k=ev.target.closest("#pad button");
      if(k) pinKey(k.dataset.k);
    });
    document.addEventListener("input", bumpIdle, {passive:true});
    document.addEventListener("touchstart", bumpIdle, {passive:true});
    document.addEventListener("keydown", e=>{
      bumpIdle();
      if($("#lock").classList.contains("on")){
        if(/^\d$/.test(e.key)) pinKey(e.key);
        if(e.key==="Backspace") pinKey("B");
        if(e.key==="Escape") pinKey("C");
      }
      if(e.key==="Escape"){ closeModal(); closeSheet(); closeSidebar(); }
    });
    $("#modal-bg").addEventListener("click", e=>{ if(e.target.id==="modal-bg") closeModal(); });
    $("#sheet-bg").addEventListener("click", e=>{ if(e.target.id==="sheet-bg") closeSheet(); });
    $("#sb-backdrop").addEventListener("click", closeSidebar);
    $("#restore-file")?.addEventListener("change", e=>{ const f=e.target.files?.[0]; if(f) doRestore(f); e.target.value=""; });
    // restore file input lives in settings page — bind globally via change on document
    document.addEventListener("change", e=>{
      if(e.target.id==="restore-file" && e.target.files?.[0]){ doRestore(e.target.files[0]); e.target.value=""; }
    });

    // expose a tiny test hook (used by headless checks, not shown in UI)
    window.__SO = {
      get db(){ return db; }, buildEscpos, strukToText, sampleSaleForTest, hasBT, hasSerial, isIOS, canDirectPrint, rp, penjualanPeriod, saldoKas, nilaiAset, sisaHutang, sisaPiutang
    };
  }

  function registerSW(){
    try{
      const host=location.hostname;
      const ok=location.protocol==="https:" || host==="localhost" || host==="127.0.0.1";
      if(!ok || !("serviceWorker" in navigator)) return;
      navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(function(){});
    }catch(e){}
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", function(){ registerSW(); boot(); });
  else { registerSW(); boot(); }
})();

</script>
</body>
</html>
